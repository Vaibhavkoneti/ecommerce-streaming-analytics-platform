name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r producer/requirements.txt flake8

      - name: Lint producer
        run: flake8 producer/app.py --max-line-length=110

      - name: Validate docker-compose config
        run: docker compose -f docker-compose.yml config -q

      - name: Build producer image
        run: docker build -t activity-producer:ci ./producer
