<svg xmlns="http://www.w3.org/2000/svg" width="980" height="320" viewBox="0 0 980 320" font-family="Segoe UI, Arial, sans-serif">
  <rect width="980" height="320" fill="#0f172a"/>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#94a3b8"/>
    </marker>
  </defs>

  <g font-size="13" fill="#e2e8f0">
    <!-- Producer -->
    <rect x="20" y="120" width="140" height="80" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
    <text x="90" y="150" text-anchor="middle" font-weight="bold">Python</text>
    <text x="90" y="168" text-anchor="middle">Activity Producer</text>
    <text x="90" y="186" text-anchor="middle" font-size="11" fill="#94a3b8">(Dockerized)</text>

    <line x1="160" y1="160" x2="230" y2="160" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>

    <!-- Kafka -->
    <rect x="230" y="100" width="150" height="120" rx="8" fill="#1e293b" stroke="#f97316" stroke-width="2"/>
    <text x="305" y="135" text-anchor="middle" font-weight="bold">Apache Kafka</text>
    <text x="305" y="155" text-anchor="middle" font-size="11">topics:</text>
    <text x="305" y="172" text-anchor="middle" font-size="11">user-activity</text>
    <text x="305" y="189" text-anchor="middle" font-size="11">transactions</text>
    <text x="305" y="206" text-anchor="middle" font-size="10" fill="#94a3b8">+ Zookeeper</text>

    <line x1="380" y1="160" x2="450" y2="160" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>

    <!-- Logstash -->
    <rect x="450" y="120" width="140" height="80" rx="8" fill="#1e293b" stroke="#a3e635" stroke-width="2"/>
    <text x="520" y="150" text-anchor="middle" font-weight="bold">Logstash</text>
    <text x="520" y="168" text-anchor="middle" font-size="11">parse / enrich</text>
    <text x="520" y="186" text-anchor="middle" font-size="11">route by event_type</text>

    <line x1="590" y1="160" x2="660" y2="160" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>

    <!-- Elasticsearch -->
    <rect x="660" y="100" width="150" height="120" rx="8" fill="#1e293b" stroke="#22d3ee" stroke-width="2"/>
    <text x="735" y="135" text-anchor="middle" font-weight="bold">Elasticsearch</text>
    <text x="735" y="155" text-anchor="middle" font-size="11">indices:</text>
    <text x="735" y="172" text-anchor="middle" font-size="11">ecommerce-user_activity-*</text>
    <text x="735" y="189" text-anchor="middle" font-size="11">ecommerce-transaction-*</text>

    <line x1="735" y1="220" x2="735" y2="250" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>

    <!-- Kibana -->
    <rect x="660" y="250" width="150" height="50" rx="8" fill="#1e293b" stroke="#c084fc" stroke-width="2"/>
    <text x="735" y="280" text-anchor="middle" font-weight="bold">Kibana Dashboard</text>

    <!-- CI/CD + Docker note -->
    <rect x="20" y="20" width="900" height="60" rx="8" fill="#111827" stroke="#475569" stroke-width="1"/>
    <text x="40" y="44" font-size="12" fill="#94a3b8">Orchestration: Docker Compose (healthchecks, resource limits, restart policies, persistent volumes)</text>
    <text x="40" y="64" font-size="12" fill="#94a3b8">CI: GitHub Actions — lint, compose-config validation, image build on every push/PR</text>
  </g>

  <text x="490" y="312" text-anchor="middle" font-size="12" fill="#64748b">Real-Time User Activity Analysis — Production Architecture</text>
</svg>
